name: OIDC provenance gate

# Reusable gate. Derives the provenance of the job that called it and verifies
# it against sources outside the calling repository.
#
# The decision lives in verify.py, not here. A battery that rewrote the logic
# would prove the rewrite; keeping it in a shipped file means what is tested is
# what runs.
#
# NO INPUTS. An earlier version took the audience as an input, which made the
# check circular: the caller chose both the value requested and the value
# compared. The audience is a constant, and verify.py re-checks it against its
# own constant -- if the two ever drift apart the token simply fails to verify,
# so the duplication can cause a rejection but never a false pass.
#
# Nothing is read from the caller's checkout and no input is accepted. The
# repository and commit of this workflow are taken from the OIDC payload, whose
# signature is verified before any of it is trusted.
#
# Three outcomes: VERIFIED, REJECTED (a rule was broken), INCONCLUSIVE (the
# verification could not be carried out). An unexpected failure is never a
# rejection.

on:
  workflow_call:
    outputs:
      result:
        description: VERIFIED, REJECTED or INCONCLUSIVE. Derived here, never accepted from the caller.
        value: ${{ jobs.gate.outputs.result }}

permissions:
  contents: read
  id-token: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.verificar.outputs.result }}
    steps:
      - name: Derive and verify provenance
        id: verificar
        shell: bash
        env:
          # Same constant as verify.py:AUDIENCIA_NORMATIVA. Duplicated on
          # purpose and checked there: drift causes a rejection, not a pass.
          AUDIENCIA: reusable-oidc-gate/provenance/v1
        run: |
          set -uo pipefail

          inconclusivo() {
            echo "RESULT=INCONCLUSIVE"
            echo "REASON=$1"
            echo "result=INCONCLUSIVE" >> "$GITHUB_OUTPUT"
            exit 1
          }

          [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || inconclusivo "no OIDC endpoint in this environment"

          tok=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCIA}" | jq -r '.value // empty') || true
          [ -n "$tok" ] || inconclusivo "token request failed"

          # Where this workflow lives comes from the token, not from an
          # environment variable and not from the caller. It is untrusted at
          # this instant -- a lie here makes the signature check fail inside
          # verify.py, which is where trust is established.
          # -r matters: without it jq emits a JSON-quoted string and the quotes
          # end up inside the repository name and the commit id. Measured: the
          # fetch then 404s and the gate reports INCONCLUSIVE forever.
          jwr=$(printf '%s' "$tok" | jq -Rr 'split(".")[1] | gsub("-";"+") | gsub("_";"/") | @base64d | fromjson | .job_workflow_ref // empty') || true
          [ -n "$jwr" ] || inconclusivo "token has no job_workflow_ref"
          repo="${jwr%%/.github/*}"
          sha="${jwr##*@}"
          [ -n "$repo" ] || inconclusivo "cannot derive the gate repository from job_workflow_ref"
          printf '%s' "$repo" | grep -Eq '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$'             || inconclusivo "the repository derived from job_workflow_ref is not a plain owner/name"

          echo "  gate repository : ${repo}"
          echo "  gate ref        : ${sha:0:12}"

          curl -sS --fail-with-body -o /tmp/verify.py \
            "https://raw.githubusercontent.com/${repo}/${sha}/verify.py" \
            || inconclusivo "verifier source unreachable at the declared commit"
          [ -s /tmp/verify.py ] || inconclusivo "verifier source empty"

          python3 -m pip install --quiet --disable-pip-version-check pyjwt cryptography \
            || inconclusivo "verifier dependencies unavailable"

          # The token never reaches the log: it goes in the environment, and the
          # verifier prints only derived facts.
          set +e
          saida=$(GATE_TOKEN="$tok" python3 /tmp/verify.py 2>&1)
          codigo=$?
          set -e
          unset tok

          printf '%s\n' "$saida"
          estado=$(printf '%s\n' "$saida" | sed -n 's/^RESULT=//p' | tail -1)
          case "$estado" in
            VERIFIED|REJECTED|INCONCLUSIVE) ;;
            # No catch-all rejection. An unrecognised outcome -- a crash, a
            # traceback, an empty stream -- means the check did not happen.
            *) inconclusivo "verifier produced no recognised outcome (exit ${codigo})" ;;
          esac

          echo "result=${estado}" >> "$GITHUB_OUTPUT"
          [ "$estado" = "VERIFIED" ] || exit 1
