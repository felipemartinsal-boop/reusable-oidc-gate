name: OIDC provenance gate

# Reusable gate. Derives the provenance of the job that called it and verifies
# it against sources outside the calling repository.
#
# ROOT OF TRUST, AND WHY IT IS HERE AND NOT IN THE TOKEN
#
# An earlier version read the repository and commit out of the JWT payload
# BEFORE verifying its signature, then downloaded a verifier from that location
# and ran it. Unauthenticated data chose the code that would do the
# authentication. Even where the happy path holds, the property claimed is that
# the signature is the root -- so nothing may depend on it before it is proven.
#
# Fixed here instead, in the file that is immutable at the approved commit:
#
#   GATE_EXPECTED_REPO   the only repository the verifier may be fetched from
#   VERIFY_SHA256        the exact bytes of verify.py that may be executed
#
# Both are checked before python runs anything. A payload naming another
# repository or another commit changes neither, so it cannot select code.
#
# NO INPUTS. An earlier version took the audience as one, which made the check
# circular: the caller chose both the value requested and the value compared.
# The audience is a constant of verify.py; it is duplicated below only to
# request the token, and verify.py re-checks it against its own constant, so
# drift can cause a rejection and never a false pass.
#
# NO RUN-TIME DEPENDENCY INSTALL. verify.py implements RS256 against the
# standard library. Pinning a commit and then installing unpinned cryptography
# would leave the approved commit verifying with different code tomorrow.
#
# Three outcomes: VERIFIED, REJECTED (a rule was broken), INCONCLUSIVE (the
# verification could not be carried out). An unexpected failure is never a
# rejection.

on:
  workflow_call:
    outputs:
      result:
        description: VERIFIED, REJECTED or INCONCLUSIVE. Derived here, never accepted from the caller.
        value: ${{ jobs.gate.outputs.result }}

permissions:
  contents: read
  id-token: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.verificar.outputs.result }}
    env:
      # --- root of trust, fixed in this file ------------------------------
      GATE_EXPECTED_REPO: felipemartinsal-boop/reusable-oidc-gate
      # sha256 of verify.py at this commit. tests/bateria.py fails if the two
      # ever drift, so a change to the verifier that forgets this line does not
      # reach the protected branch.
      VERIFY_SHA256: c94bfda909b68307efeb0bf59044f834e756bcd1853593e2ad04c7972d478823
      # Same constant as verify.py:AUDIENCIA_NORMATIVA.
      AUDIENCIA: reusable-oidc-gate/provenance/v1
      # The commit of THIS workflow file, set by the platform for the called
      # workflow. Measured, not assumed: GITHUB_WORKFLOW_SHA describes the
      # CALLER -- using it made the gate fetch its own verifier at the caller's
      # commit, which 404s. `github.job_workflow_sha` is the one that describes
      # the workflow that provided the job. Neither comes from the token.
      COMMIT_DO_GATE: ${{ github.job_workflow_sha }}
      COMMIT_DO_CHAMADOR: ${{ github.workflow_sha }}
    steps:
      - name: Fetch the pinned verifier and check its digest
        id: fonte
        shell: bash
        run: |
          set -uo pipefail

          inconclusivo() {
            echo "RESULT=INCONCLUSIVE"
            echo "REASON=$1"
            echo "result=INCONCLUSIVE" >> "$GITHUB_OUTPUT"
            exit 1
          }

          # The commit is this workflow's own, reported by the platform for the
          # workflow file that provided this job. It is NOT taken from the token.
          sha="${COMMIT_DO_GATE:-}"
          case "$sha" in
            ????????????????????????????????????????) ;;
            *) inconclusivo "the platform did not expose this workflow's own commit" ;;
          esac
          echo "  expected repository : ${GATE_EXPECTED_REPO}"
          echo "  gate commit         : ${sha:0:12}"
          echo "  caller commit       : ${COMMIT_DO_CHAMADOR:0:12}  (not used to fetch anything)"

          # Both halves of this URL are constants of this file. Nothing the
          # caller or the token says can move it.
          curl -sS --fail-with-body -o /tmp/verify.py \
            "https://raw.githubusercontent.com/${GATE_EXPECTED_REPO}/${sha}/verify.py" \
            || inconclusivo "verifier source unreachable at the pinned commit"
          [ -s /tmp/verify.py ] || inconclusivo "verifier source empty"

          obtido=$(sha256sum /tmp/verify.py | cut -d' ' -f1)
          echo "  verifier digest     : ${obtido:0:12}"
          if [ "$obtido" != "$VERIFY_SHA256" ]; then
            inconclusivo "verifier digest does not match the one pinned in this workflow"
          fi

      - name: Derive and verify provenance
        id: verificar
        shell: bash
        run: |
          set -uo pipefail

          inconclusivo() {
            echo "RESULT=INCONCLUSIVE"
            echo "REASON=$1"
            echo "result=INCONCLUSIVE" >> "$GITHUB_OUTPUT"
            exit 1
          }

          [ -f /tmp/verify.py ] || inconclusivo "the pinned verifier was not made available"
          [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || inconclusivo "no OIDC endpoint in this environment"

          tok=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCIA}" | jq -r '.value // empty') || true
          [ -n "$tok" ] || inconclusivo "token request failed"

          # The token never reaches the log: it goes in the environment, and the
          # verifier prints only derived facts.
          set +e
          saida=$(GATE_TOKEN="$tok" GATE_EXPECTED_REPO="$GATE_EXPECTED_REPO" python3 /tmp/verify.py 2>&1)
          codigo=$?
          set -e
          unset tok

          printf '%s\n' "$saida"
          estado=$(printf '%s\n' "$saida" | sed -n 's/^RESULT=//p' | tail -1)
          case "$estado" in
            VERIFIED|REJECTED|INCONCLUSIVE) ;;
            # No catch-all rejection. An unrecognised outcome -- a crash, a
            # traceback, an empty stream -- means the check did not happen.
            *) inconclusivo "verifier produced no recognised outcome (exit ${codigo})" ;;
          esac

          echo "result=${estado}" >> "$GITHUB_OUTPUT"
          [ "$estado" = "VERIFIED" ] || exit 1
